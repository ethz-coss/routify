services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # No explicit Spring profile; default configuration is used
    networks:
      - routify-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - routify-network
    depends_on:
      backend:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        echo "Waiting for Photon API before starting nginx..." &&
        until curl -fs http://photon:2322/api?q=Zurich >/dev/null; do
          echo "Photon not ready yet; retrying in 10s";
          sleep 10;
        done &&
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 60s
      retries: 30
      start_period: 60s

  nominatim:
    image: mediagis/nominatim:4.2
    environment:
      - PBF_URL=https://download.geofabrik.de/europe/switzerland-latest.osm.pbf
      - REPLICATION_URL=https://download.geofabrik.de/europe/switzerland-updates
      - IMPORT_WIKIPEDIA=false
      - NOMINATIM_PASSWORD=password
    ports:
      - "8081:8080"
    networks:
      - routify-network
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
    healthcheck:
      test:
        - CMD-SHELL
        - >
          [ -f /var/lib/postgresql/14/main/import-finished ] &&
          curl -fs http://localhost:8080/status >/dev/null
          || exit 1
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 600s

  photon:
    build:
      context: ./photon
      dockerfile: Dockerfile
    ports:
      - "2322:2322"
    networks:
      - routify-network
    depends_on:
      nominatim:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2322/api?q=test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  airqualityservice:
    build:
      context: ./airqualityservice
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - routify-network
    command: ["python", "OstLuftApi.py", "--use-seed", "seed_1752321204.png"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  routify-network:
    driver: bridge

volumes:
  nominatim_data:
